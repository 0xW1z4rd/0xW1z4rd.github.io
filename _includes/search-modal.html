<div class="search-modal" id="search-modal" role="dialog" aria-modal="true" aria-label="Search">
  <div class="search-box">

    <div class="search-header">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input
        type="search"
        class="search-input"
        id="search-input"
        placeholder="Search posts, writeups, tags..."
        autocomplete="off"
        spellcheck="false"
        aria-label="Search"
      >
      <button class="search-close" aria-label="Close search">Esc</button>
    </div>

    <div class="search-results" id="search-results" role="listbox"></div>

    <div class="search-footer">
      <span class="search-hint"><kbd>&uarr;</kbd><kbd>&darr;</kbd> navigate</span>
      <span class="search-hint"><kbd>Enter</kbd> open</span>
      <span class="search-hint"><kbd>Esc</kbd> close</span>
    </div>

  </div>
</div>

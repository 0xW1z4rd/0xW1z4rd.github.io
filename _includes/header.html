<header class="site-header" id="site-header">
  <div class="container">
    <div class="header-inner">

      <!-- Logo -->
      <a href="{{ '/' | relative_url }}" class="site-logo" aria-label="{{ site.title }}">
        <svg class="logo-svg" width="34" height="34" viewBox="0 0 50 50" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <circle cx="25" cy="25" r="23" fill="none" stroke="#7c3aed" stroke-width="1.2" opacity="0.55"/>
          <circle cx="25" cy="25" r="15" fill="none" stroke="#a855f7" stroke-width="0.6" opacity="0.3"/>
          <path d="M11 18 L17 33 L25 21 L33 33 L39 18"
                fill="none" stroke="#c084fc" stroke-width="2.6"
                stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="11" cy="18" r="1.8" fill="#7c3aed" opacity="0.85"/>
          <circle cx="39" cy="18" r="1.8" fill="#7c3aed" opacity="0.85"/>
          <line x1="25" y1="2.5" x2="25" y2="8" stroke="#a855f7" stroke-width="1.2" opacity="0.4" stroke-linecap="round"/>
          <line x1="25" y1="42" x2="25" y2="47.5" stroke="#a855f7" stroke-width="1.2" opacity="0.4" stroke-linecap="round"/>
        </svg>
        <span class="logo-text">Wizard</span>
      </a>

      <!-- Desktop navigation -->
      <nav class="site-nav" aria-label="Main navigation">
        <ul class="nav-links">
          {% for item in site.data.navigation %}
          <li>
            <a href="{{ item.url | relative_url }}"
               class="nav-link{% if page.url contains item.url and item.url != '/' %} active{% endif %}">
              {{ item.title }}
            </a>
          </li>
          {% endfor %}
        </ul>
      </nav>

      <!-- Header actions -->
      <div class="header-actions">

        <button class="search-toggle icon-btn" aria-label="Search (Ctrl+K)">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          <kbd>⌘K</kbd>
        </button>

        <button class="theme-toggle icon-btn" aria-label="Toggle light/dark mode">
          <!-- Moon (shown in dark mode) -->
          <svg class="icon-moon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
          <!-- Sun (shown in light mode) -->
          <svg class="icon-sun" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="12" cy="12" r="5"/>
            <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
            <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
          </svg>
        </button>

        <button class="nav-toggle icon-btn" aria-label="Toggle menu" aria-expanded="false" aria-controls="nav-menu">
          <span class="hamburger"></span>
        </button>

      </div>
    </div>

    <!-- Mobile navigation -->
    <nav class="nav-menu" id="nav-menu" aria-label="Mobile navigation" hidden>
      <ul class="nav-menu-links">
        {% for item in site.data.navigation %}
        <li>
          <a href="{{ item.url | relative_url }}" class="nav-menu-link">{{ item.title }}</a>
        </li>
        {% endfor %}
      </ul>
    </nav>

  </div>
</header>

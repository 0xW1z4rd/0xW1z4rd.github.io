<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="X-UA-Compatible" content="IE=edge">

<title>
  {%- if page.title and page.layout != 'home' -%}
    {{ page.title }} &mdash; {{ site.title }}
  {%- else -%}
    {{ site.title }} &mdash; {{ site.tagline }}
  {%- endif -%}
</title>

<meta name="description" content="{{ page.description | default: page.excerpt | default: site.description | strip_html | truncate: 160 }}">
<meta name="author" content="{{ page.author | default: site.author.name }}">

{% seo %}

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:ital,wght@0,400;0,500;1,400&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- CSS -->
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">

<!-- Favicon -->
<link rel="icon" type="image/svg+xml" href="{{ '/assets/images/favicon.svg' | relative_url }}">

<!-- Feed -->
<link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">

<!-- Theme -->
<meta name="theme-color" content="#7c3aed">
<meta name="color-scheme" content="dark light">

<!-- OpenGraph -->
<meta property="og:image" content="{{ page.image | default: '/assets/images/og-default.svg' | absolute_url }}">
<meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">

<!-- Twitter -->
<meta name="twitter:card" content="summary_large_image">
{% if site.twitter.username %}
<meta name="twitter:site" content="@{{ site.twitter.username }}">
{% endif %}

<!-- Security headers hint -->
<meta http-equiv="X-Content-Type-Options" content="nosniff">
<meta name="referrer" content="strict-origin-when-cross-origin">

<!-- Preload reading progress bar for posts -->
{% if page.layout == 'post' %}
<style>
  .reading-progress {
    position: fixed;
    top: 0;
    left: 0;
    height: 2px;
    width: 0%;
    background: linear-gradient(90deg, #7c3aed, #c084fc, #a855f7);
    z-index: 1000;
    transition: width 0.1s linear;
    border-radius: 0 2px 2px 0;
  }
</style>
{% endif %}

<section class="comments" style="margin-top:4rem;padding-top:2rem;border-top:1px solid rgba(124,58,237,0.2)">
  <h3 style="font-size:1.125rem;font-weight:600;color:#c4b5fd;margin-bottom:1.5rem">Discussion</h3>
  <script src="https://giscus.app/client.js"
    data-repo="{{ site.giscus.repo }}"
    data-repo-id="{{ site.giscus.repo_id }}"
    data-category="{{ site.giscus.category }}"
    data-category-id="{{ site.giscus.category_id }}"
    data-mapping="{{ site.giscus.mapping | default: 'pathname' }}"
    data-strict="0"
    data-reactions-enabled="{{ site.giscus.reactions_enabled | default: '1' }}"
    data-emit-metadata="0"
    data-input-position="top"
    data-theme="{{ site.giscus.theme | default: 'dark' }}"
    data-lang="en"
    data-loading="lazy"
    crossorigin="anonymous"
    async>
  </script>
</section>
